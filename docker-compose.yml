# Cross-Plattform-Entwicklung (Windows + macOS) ohne lokale Venv/Node-Setups:
#   docker compose up --build
# Frontend: http://127.0.0.1:5173  |  Backend: http://127.0.0.1:8000
#
# LM Studio / Ollama laufen auf dem HOST-Rechner. Aus dem Container heraus
# sind sie ueber host.docker.internal erreichbar (Docker Desktop auf Win/Mac).

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LMSTUDIO_URLS=${LMSTUDIO_URL:-http://host.docker.internal:1234},http://host.docker.internal:1234
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-}
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_TIMEOUT=${LLM_TIMEOUT:-90}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_BASE_URL=${CLOUD_BASE_URL:-}
      - CLOUD_MODEL=${CLOUD_MODEL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - CLOUD_TIMEOUT=${CLOUD_TIMEOUT:-45}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--reload", "--reload-dir", "backend", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      # Same-origin API calls keep working for public users and are proxied
      # from the frontend container to the backend service below.
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend
